# MK Typist (Holtek HT32F52352, Cortex-M0+, LQFP64) over SWD with a Raspberry Pi Pico running debugprobe.
# Needs hansemro/openocd-ht32, branch ht32f165x-dev. Untested on hardware.
# Wiring: docs/debug-access.md. The keyboard is powered by its own USB cable; the probe shares GND only.
#
# Read-only use: openocd -f openocd/typist.cfg -c init -c "flash info 0" -c shutdown
# Do not add erase, write or unlock commands here. The chip is locked, and a mass erase
# also deletes the stock IAP bootloader (see docs/debug-access.md).

adapter driver cmsis-dap
transport select swd

# The ht32f165x flash driver also handles the HT32F5xxxx FMC (re-masterkeys used it on
# the HT32F52352). The target file defaults to the Cortex-M3 SW-DP ID, so pass the
# Cortex-M0+ one.
set CPUTAPID 0x0bc11477
set HT32_FLASH_SIZE 0x20000
set HT32_SRAM_SIZE 0x4000
source [find target/ht32f165x.cfg]

# The target file ends with "adapter speed 12" and "reset_config trst_only".
# Run at 1 MHz and use nRST (Pico GP1) so we can attach under reset.
adapter speed 1000
reset_config srst_only srst_nogate connect_assert_srst
